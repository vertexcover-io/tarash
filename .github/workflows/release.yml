name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Extract tag version
        id: tag_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Build tarash-gateway
      - name: Build tarash-gateway
        working-directory: packages/tarash-gateway
        run: uv build --no-sources

      - name: Smoke test tarash-gateway (wheel)
        run: uv run --isolated --no-project --with packages/tarash-gateway/dist/*.whl python -c "import tarash.tarash_gateway; print(tarash.tarash_gateway.__version__)"

      # Build tarash-scene-detector (optional)
      # - name: Build tarash-scene-detector
      #   working-directory: packages/scene_detector
      #   run: uv build --no-sources

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog_config.json"
          toTag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        run: |
          # Create new changelog entry
          echo "## [${{ github.ref_name }}] - $(date +%Y-%m-%d)" > temp_changelog.md
          echo "" >> temp_changelog.md
          echo "${{ steps.changelog.outputs.changelog }}" >> temp_changelog.md
          echo "" >> temp_changelog.md

          # Prepend new entry to existing changelog (after header)
          head -n 7 CHANGELOG.md > new_changelog.md
          cat temp_changelog.md >> new_changelog.md
          tail -n +8 CHANGELOG.md >> new_changelog.md
          mv new_changelog.md CHANGELOG.md
          rm temp_changelog.md

      - name: Commit updated CHANGELOG.md
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git stash push -m "temp changelog changes"
          git checkout main
          git stash pop
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }}" || exit 0
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tarash ${{ steps.tag_version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            packages/tarash-gateway/dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tarash-gateway to PyPI
        working-directory: packages/tarash-gateway
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      # Publish tarash-scene-detector to PyPI (optional)
      # - name: Publish tarash-scene-detector to PyPI
      #   working-directory: packages/scene_detector
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      #   run: uv publish
