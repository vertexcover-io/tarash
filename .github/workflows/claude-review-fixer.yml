name: Claude Review Fixer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-pr-comment-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude-harness') && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-harness'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch review comments JSON
        id: comments
        env:
          GH_TOKEN: ${{ secrets.HARNESS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Fetch all file-level review comments on this PR
          REVIEW_COMMENTS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq '[.[] | {id: .id, path: .path, line: (.line // .original_line), body: .body, diff_hunk: .diff_hunk}]' 2>/dev/null || echo "[]")

          # Write to file (avoids shell escaping issues with multiline JSON)
          echo "${REVIEW_COMMENTS}" > /tmp/review-comments.json
          echo "comments_file=/tmp/review-comments.json" >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          base_branch: master
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.HARNESS_PAT }}
          plugin_marketplaces: 'https://github.com/vertexcover-io/harness-engineering.git'
          plugins: 'harness@main'
          prompt: |
            Use /review-fixer to address the review feedback below.

            PR #${{ github.event.issue.number || github.event.pull_request.number }}
            Repository: ${{ github.repository }}
            Reviewer: ${{ github.event.comment.user.login }}

            Review body:
            ${{ github.event.comment.body }}

            Review comments (file-level):
            Read the file at /tmp/review-comments.json for the full list of file-level review comments with paths, line numbers, diff hunks, and comment IDs.
          show_full_output: true
          claude_args: |
            --model opus
            --effort high
            --max-turns 30
