[project]
name = "tarash-lint"
version = "0.1.0"
description = "Structural linter for tarash-gateway providers"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tarash-lint = "tarash_linter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarash_linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
